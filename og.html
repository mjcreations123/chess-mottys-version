<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og card</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background: var(--bg);
    font-family: var(--font-ui);
    color: var(--text);
    display: flex;
    overflow: hidden;
    position: relative;
  }
  .tick { display: none; }
  .left {
    flex: 1.15;
    padding: 60px 20px 60px 74px;
    display: flex; flex-direction: column; justify-content: center;
    position: relative; z-index: 1;
  }
  .crest { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
  .crest svg { width: 80px; height: 80px; display: block; }
  .chip {
    font-size: 17px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 9px 18px; border: 3px solid var(--alarm); color: var(--alarm);
    border-radius: 9px;
  }
  .bureau {
    font-size: 17px; font-weight: 600;
    letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 16px;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 800; letter-spacing: -0.005em;
    font-size: 62px; line-height: 1.06; margin-bottom: 20px;
  }
  h1 em { font-style: normal; color: var(--seal); }
  .sub { font-size: 25px; line-height: 1.5; max-width: 520px; color: var(--text); }
  .sub strong { font-weight: 700; color: var(--seal); }
  .record {
    margin-top: 26px; font-family: var(--font-mono); font-size: 20px;
    color: var(--alarm); font-weight: 600;
  }
  .right {
    flex: 1;
    display: grid; place-items: center;
    position: relative; z-index: 1;
    padding-right: 44px;
  }
  .mini {
    width: 430px; height: 430px;
    border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
    display: grid; grid-template: repeat(4, 1fr) / repeat(4, 1fr);
    position: relative;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
  }
  .sq { background: var(--sq-light); display: grid; place-items: center; }
  .sq.d { background: var(--sq-dark); }
  .sq svg { width: 86%; height: 86%; }
  .w { --pf: #faf6ea; --ps: #14110d; --psw: 1.5; }
  .b { --pf: #14110d; --ps: #f2ecdc; --psw: 1; }
  .stamp {
    position: absolute; left: 50%; top: 46%;
    transform: translate(-50%, -50%) rotate(-9deg);
    font-family: var(--font-ui); font-weight: 800;
    font-size: 62px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--alarm);
    border: 6px solid var(--alarm); padding: 8px 30px;
    background: rgba(13, 17, 23, 0.84); border-radius: 10px;
    box-shadow: 0 16px 60px rgba(0, 0, 0, 0.6);
  }
</style>
</head>
<body>
  <div class="tick tick--tl"></div>
  <div class="tick tick--br"></div>
  <div class="left">
    <div class="crest"><span id="crest-og"></span><span class="chip">Official</span></div>
    <p class="bureau">International Bureau of Chess Integrity</p>
    <h1>You have been <em>challenged</em></h1>
    <p class="sub"><strong>GM* MottyBot (2882*)</strong> awaits. Certified fair by every committee it chairs.</p>
    <p class="record">Humans defeated: all. Wins against it: 0.</p>
  </div>
  <div class="right">
    <div class="mini" id="mini"></div>
  </div>
<script type="module">
  import { injectSprite, pieceSVG, crestSVG } from './js/pieces.js';
  injectSprite();
  document.getElementById('crest-og').innerHTML = crestSVG();
  // a white king audited into a corner by four queens
  const cells = [
    ['', 'bq', '', 'bq'],
    ['', '', '', ''],
    ['bq', '', 'bn', ''],
    ['wk', '', '', 'bq'],
  ];
  const mini = document.getElementById('mini');
  cells.forEach((row, r) => row.forEach((cell, c) => {
    const el = document.createElement('div');
    el.className = 'sq' + ((r + c) % 2 ? ' d' : '');
    if (cell) {
      el.classList.add(cell[0]);
      el.innerHTML = pieceSVG(cell[1]);
    }
    mini.appendChild(el);
  }));
  const stamp = document.createElement('div');
  stamp.className = 'stamp';
  stamp.textContent = 'Fair';
  mini.appendChild(stamp);
</script>
</body>
</html>
