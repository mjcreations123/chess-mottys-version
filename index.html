<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chess (Motty's Version)</title>
<meta name="description" content="Play chess online. Fair engine, standard rules, except one of your pieces teleports to a random square before every turn you play. Good luck with your opening prep.">
<meta property="og:title" content="Chess (Motty's Version)">
<meta property="og:description" content="Real chess. Fair engine. Except before every turn you play, one of your own pieces teleports somewhere random. Beat me if you can.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://chess-mottys-version.vercel.app/">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="shell">
  <aside class="rail" id="rail">
    <a class="brand" href="/">
      <svg viewBox="0 0 100 100" class="brand__mark" aria-hidden="true"><use href="#pc-wp"/></svg>
      <span class="brand__word">chess<em>MOTTY'S VERSION</em></span>
    </a>
    <nav class="rail__nav">
      <button class="rail__btn" id="nav-new" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.5-4.8 2.5.9-5.4L4.2 8.7l5.4-.8z" fill="currentColor"/></svg>
        New Game
      </button>
      <button class="rail__btn" id="nav-rules" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9a3 3 0 0 1 3 3v15l-4-2.5L10 21l-4-2.5V3z" fill="currentColor"/></svg>
        The Rules
      </button>
      <button class="rail__btn" id="nav-sound" type="button" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path class="snd-waves" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        <span id="nav-sound-label">Sound On</span>
      </button>
    </nav>
    <p class="rail__foot">Fair engine.<br>Chaotic universe.</p>
  </aside>

  <main class="stage">
    <div class="game-col">
      <div class="player-row" id="row-top">
        <div class="avatar" id="top-avatar"></div>
        <div class="player-meta">
          <div class="player-name"><span id="top-name">MottyBot</span> <span class="rating" id="top-rating"></span></div>
          <div class="captured" id="top-captured"></div>
        </div>
        <div class="thinking" id="top-thinking" hidden><i></i><i></i><i></i></div>
      </div>

      <div class="board-frame">
        <div class="board" id="board" aria-label="chess board"></div>
        <div class="tele-chip" id="tele-chip" hidden></div>
      </div>

      <div class="player-row" id="row-bottom">
        <div class="avatar avatar--you" id="bottom-avatar"></div>
        <div class="player-meta">
          <div class="player-name"><span id="bottom-name">You</span> <span class="rating" id="bottom-rating"></span></div>
          <div class="captured" id="bottom-captured"></div>
        </div>
        <div class="turn-tag" id="turn-tag" hidden>your move</div>
      </div>
    </div>

    <aside class="panel" id="panel"></aside>
  </main>
</div>

<div class="modal-scrim" id="modal-scrim" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
